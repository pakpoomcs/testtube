<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="gls" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <clipPath id="inner">
      <rect x="10" y="2" width="12" height="22"/>
      <circle cx="16" cy="24" r="6"/>
    </clipPath>
  </defs>

  <!-- Tube shell -->
  <rect x="9" y="2" width="14" height="22" rx="3" fill="#1a1a20" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>
  <circle cx="16" cy="24" r="6.6" fill="#1a1a20" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>

  <!-- Liquid fill -->
  <g clip-path="url(#inner)">
    <rect x="10" y="14" width="12" height="16" fill="url(#liq)"/>
    <!-- shimmer -->
    <rect x="10" y="14" width="4" height="16" fill="rgba(255,255,255,0.15)"/>
    <!-- bubble -->
    <circle cx="15" cy="20" r="1.4" fill="rgba(255,255,255,0.30)"/>
    <circle cx="18" cy="24" r="0.9" fill="rgba(255,255,255,0.22)"/>
  </g>

  <!-- Glass highlight -->
  <rect x="10" y="2" width="4" height="22" fill="url(#gls)" clip-path="url(#inner)"/>

  <!-- Rim -->
  <rect x="9" y="2" width="14" height="3" rx="1.5" fill="rgba(255,255,255,0.10)"/>
  <line x1="10.5" y1="3" x2="21.5" y2="3" stroke="rgba(255,255,255,0.25)" stroke-width="1" stroke-linecap="round"/>
</svg>
